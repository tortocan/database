 name: Sync fork
  on:
    schedule: [{ cron: '0 */6 * * *' }]
    workflow_dispatch:
  permissions: { contents: write }                       
  jobs:
    sync:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with: { fetch-depth: 0 }
        - run: |
            git config user.name  "sync-bot"
            git config user.email "sync-bot@users.noreply.github.com"
            git remote add upstream https://github.com/Dictionarry-Hub/database.git
            git fetch upstream v2
            git merge --no-edit upstream/v2
            git push origin v2
